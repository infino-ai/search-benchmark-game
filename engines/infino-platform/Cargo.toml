[package]
name = "infino-platform-bench"
version = "0.1.0"
edition = "2024"

# The engines/infino-branch code, built with infino's `remote` feature. This
# is a separate crate because older infino refs lack `remote`, and cargo fails
# on a manifest that names a missing feature, even an unused one. It also
# builds into its own target/, so the two engines' binaries stay separate.
[lib]
name = "infino_bench"
path = "../infino-branch/src/lib.rs"

[[bin]]
name = "build_index"
path = "../infino-branch/src/bin/build_index.rs"

[[bin]]
name = "do_query"
path = "../infino-branch/src/bin/do_query.rs"

[features]
default = ["hosted"]
hosted = []

[dependencies]
infino = { path = "../../../infino", features = ["test-helpers", "remote"] }
arrow-array = "58"
arrow-schema = "58"
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
