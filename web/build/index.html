<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="//fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic"><link rel="stylesheet" href="//cdn.rawgit.com/milligram/milligram/master/dist/milligram.min.css"><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="The search benchmark"/><title>Search benchmark, the game</title><link href="./static/css/main.27669ca4.chunk.css" rel="stylesheet"><style id="headline-style">
#headline-summary{margin:0 0 24px 0;}
#headline-summary .hl-title{font-size:13px;color:#444;margin-bottom:10px;}
#headline-summary .hl-hint{color:#717171;}
#headline-summary table{border-collapse:collapse;width:100%;}
#headline-summary th,#headline-summary td{border:1px solid #ddd;padding:8px 10px;text-align:right;font-size:13px;}
#headline-summary th{background:#382373;color:#fff;font-weight:bold;}
#headline-summary th:first-child,#headline-summary td.hl-engine{text-align:left;}
#headline-summary td.hl-engine{font-weight:bold;word-break:break-word;}
#headline-summary .hl-summary-row td{font-weight:bold;border-top:2px solid #382373;}

</style></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div class="container"><div class="row"><div class="column"><h1>Search Benchmark, the Game</h1></div></div><div class="row"><div class="description column"></div><br/><br/></div></div><div class="row"><div class="column"><div id="headline-summary"></div></div></div><script id="headline-script">
(function(){
  function esc(s){return (''+s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function shapeAvg(qs){
    if(!qs||!qs.length) return undefined;
    var total=0;
    for(var i=0;i<qs.length;i++){var q=qs[i]; if(!q.duration||!q.duration.length) return undefined; total+=q.duration[0];}
    return total/qs.length;
  }
  function ratioClass(r,isBase){
    if(isBase) return 'hl-base';
    if(r===undefined) return '';
    return r>1.005?'hl-slower':(r<0.995?'hl-faster':'');
  }
  function fmt(r){return r===undefined?'\u2014':r.toFixed(2);}
  function render(data){
    var el=document.getElementById('headline-summary');
    if(!el||!data||!data.results) return;
    var modes=Object.keys(data.results); if(!modes.length) return;
    var engines=Object.keys(data.results[modes[0]]);
    var lucene=engines.filter(function(e){return e.toLowerCase().indexOf('lucene')>=0;})[0];
    // Column order: infino first, Lucene second, everything else after in data order.
    var infino=engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0 && e.indexOf('@')<0;})[0]
      || engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0;})[0];
    var ordered=[];
    if(infino) ordered.push(infino);
    if(lucene && lucene!==infino) ordered.push(lucene);
    engines.forEach(function(e){ if(e!==infino && e!==lucene) ordered.push(e); });
    engines=ordered;
    var avg={};
    engines.forEach(function(e){avg[e]={}; modes.forEach(function(m){avg[e][m]=shapeAvg(data.results[m][e]);});});
    // ratio[engine][mode] to lucene; summary = arithmetic mean of per-shape ratios.
    var ratio={},summ={};
    engines.forEach(function(engine){
      ratio[engine]={}; var sum=0,n=0;
      modes.forEach(function(mode){
        var base=lucene?avg[lucene][mode]:undefined;
        var v=avg[engine][mode];
        var r=(v===undefined||!base)?undefined:v/base;
        ratio[engine][mode]=r;
        if(r!==undefined){sum+=r;n++;}
      });
      summ[engine]=n===0?undefined:sum/n;
    });
    var head='<tr><th>Query shape</th>'+engines.map(function(e){return '<th>'+esc(e)+'</th>';}).join('')+'</tr>';
    var body=modes.map(function(mode){
      var cells=engines.map(function(engine){
        var r=ratio[engine][mode];
        return '<td class="hl-cell '+ratioClass(r,engine===lucene)+'">'+fmt(r)+'</td>';
      }).join('');
      return '<tr><td class="hl-engine">'+esc(mode)+'</td>'+cells+'</tr>';
    }).join('');
    var summRow='<tr class="hl-summary-row"><td class="hl-engine">Mean</td>'+engines.map(function(engine){
      return '<td class="hl-cell '+ratioClass(summ[engine],engine===lucene)+'">'+fmt(summ[engine])+'</td>';
    }).join('')+'</tr>';
    el.innerHTML='<div class="hl-title">Latency relative to Lucene = 1.00 <span class="hl-hint">(&gt;1 = slower; per shape, then mean across shapes)</span></div><table><thead>'+head+'</thead><tbody>'+body+summRow+'</tbody></table>';
  }
  function load(){ fetch('results.json').then(function(r){return r.json();}).then(render).catch(function(){}); }
  if(document.readyState!=='loading') load(); else document.addEventListener('DOMContentLoaded',load);
})();
