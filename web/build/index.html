<!doctype html><html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="//fonts.googleapis.com/css?family=Roboto:300,300italic,700,700italic"><link rel="stylesheet" href="//cdn.rawgit.com/milligram/milligram/master/dist/milligram.min.css"><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="description" content="The search benchmark"/><title>Search benchmark, the game</title><link href="./static/css/main.27669ca4.chunk.css" rel="stylesheet"><style id="headline-style">

</style></head><body><noscript>You need to enable JavaScript to run this app.</noscript><div class="container"><div class="row"><div class="column"><h1>Search Benchmark, the Game</h1></div></div><div class="row"><div class="description column"></div><br/><br/></div></div><div class="row"><div class="column"><div id="headline-summary"></div></div></div><script id="headline-script">
(function(){
  function esc(s){return (''+s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function shapeAvg(qs){
    if(!qs||!qs.length) return undefined;
    var total=0;
    for(var i=0;i<qs.length;i++){var q=qs[i]; if(!q.duration||!q.duration.length) return undefined; total+=q.duration[0];}
    return total/qs.length;
  }
  function ratioClass(r,isBase){
    if(isBase) return 'hl-base';
    if(r===undefined) return '';
    return r>1.005?'hl-slower':(r<0.995?'hl-faster':'');
  }
  function meanNumClass(r,isBase){
    if(isBase||r===undefined) return 'hl-mean-num';
    return 'hl-mean-num '+(r>1.005?'hl-mean-slower':(r<0.995?'hl-mean-faster':''));
  }
  function fmt(r){return r===undefined?'—':r.toFixed(2);}
  function render(data){
    var el=document.getElementById('headline-summary');
    if(!el||!data||!data.results) return;
    var modes=Object.keys(data.results); if(!modes.length) return;
    var engines=Object.keys(data.results[modes[0]]);
    var lucene=engines.filter(function(e){return e.toLowerCase().indexOf('lucene')>=0;})[0];
    // Column order: infino first, Lucene second, everything else after in data order.
    var infino=engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0 && e.indexOf('@')<0;})[0]
      || engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0;})[0];
    var ordered=[];
    if(infino) ordered.push(infino);
    if(lucene && lucene!==infino) ordered.push(lucene);
    engines.forEach(function(e){ if(e!==infino && e!==lucene) ordered.push(e); });
    engines=ordered;
    // Split shapes into search (ranked top-k) and count families. Any shape whose
    // name mentions COUNT (COUNT, TOP_*_COUNT) is a count command; the rest are
    // search. The two means are reported separately because a count command
    // stresses posting-list traversal while a top-k command stresses scoring —
    // averaging them into one number hides which an engine is actually good at.
    var isCount=function(m){return m.toUpperCase().indexOf('COUNT')>=0;};
    var searchModes=modes.filter(function(m){return !isCount(m);});
    var countModes=modes.filter(function(m){return isCount(m);});
    var avg={};
    engines.forEach(function(e){avg[e]={}; modes.forEach(function(m){avg[e][m]=shapeAvg(data.results[m][e]);});});
    // ratio[engine][mode] relative to lucene; each summary value is the arithmetic
    // mean of the per-shape ratios within one family (every shape weighted equally).
    var ratio={};
    engines.forEach(function(engine){
      ratio[engine]={};
      modes.forEach(function(mode){
        var base=lucene?avg[lucene][mode]:undefined;
        var v=avg[engine][mode];
        ratio[engine][mode]=(v===undefined||!base)?undefined:v/base;
      });
    });
    var meanOver=function(engine,subset){
      var sum=0,n=0;
      subset.forEach(function(mode){var r=ratio[engine][mode]; if(r!==undefined){sum+=r;n++;}});
      return n===0?undefined:sum/n;
    };
    var head='<tr><th>Query shape</th>'+engines.map(function(e){return '<th>'+esc(e)+'</th>';}).join('')+'</tr>';
    var body=modes.map(function(mode){
      var cells=engines.map(function(engine){
        var r=ratio[engine][mode];
        return '<td class="hl-cell '+ratioClass(r,engine===lucene)+'">'+fmt(r)+'</td>';
      }).join('');
      return '<tr><td class="hl-engine">'+esc(mode)+'</td>'+cells+'</tr>';
    }).join('');
    var summRow='<tr class="hl-summary-row"><td class="hl-engine">Mean<div class="hl-mean-sublabel">search / count</div></td>'+engines.map(function(engine){
      var isBase=engine===lucene;
      var rs=meanOver(engine,searchModes), rc=meanOver(engine,countModes);
      return '<td class="hl-cell hl-mean-cell'+(isBase?' hl-base':'')+'">'
        +'<div class="hl-mean-item"><span class="hl-mean-lbl">search</span><span class="'+meanNumClass(rs,isBase)+'">'+fmt(rs)+'</span></div>'
        +'<div class="hl-mean-item"><span class="hl-mean-lbl">count</span><span class="'+meanNumClass(rc,isBase)+'">'+fmt(rc)+'</span></div>'
        +'</td>';
    }).join('')+'</tr>';
    el.innerHTML='<div class="hl-title">Latency relative to Lucene = 1.00 <span class="hl-hint">(&gt;1 = slower; per shape, then mean split into search top-k and count)</span></div><table><thead>'+head+'</thead><tbody>'+body+summRow+'</tbody></table>';
  }
  function load(){ fetch('results.json').then(function(r){return r.json();}).then(render).catch(function(){}); }
  if(document.readyState!=='loading') load(); else document.addEventListener('DOMContentLoaded',load);
})();
</script><div class="row"><div class="column"><div id="indexsize-summary"></div></div></div><script id="indexsize-script">
(function(){
  function esc(s){return (''+s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
  function fmtBytes(n){
    if(n===undefined||n===null) return '\u2014';
    var u=['B','KiB','MiB','GiB','TiB'],i=0,v=n;
    while(v>=1024&&i<u.length-1){v/=1024;i++;}
    return (i===0?v.toFixed(0):v.toFixed(2))+' '+u[i];
  }
  function sizeClass(r,isBase){ if(isBase) return 'hl-base'; if(r>1.005) return 'hl-slower'; if(r<0.995) return 'hl-faster'; return ''; }
  function render(data){
    var el=document.getElementById('indexsize-summary');
    if(!el||!data) return;
    var sizes=data.index_sizes;
    if(!sizes){ el.style.display='none'; return; }
    var engines=Object.keys(sizes).filter(function(e){return sizes[e]!==undefined && sizes[e]!==null;});
    if(!engines.length){ el.style.display='none'; return; }
    var lucene=engines.filter(function(e){return e.toLowerCase().indexOf('lucene')>=0;})[0];
    var infino=engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0 && e.indexOf('@')<0;})[0]
      || engines.filter(function(e){return e.toLowerCase().indexOf('infino')>=0;})[0];
    var ordered=[];
    if(infino) ordered.push(infino);
    if(lucene && lucene!==infino) ordered.push(lucene);
    engines.forEach(function(e){ if(e!==infino && e!==lucene) ordered.push(e); });
    engines=ordered;
    var base=lucene?sizes[lucene]:undefined;
    var head='<tr><th>Metric</th>'+engines.map(function(e){return '<th>'+esc(e)+'</th>';}).join('')+'</tr>';
    var sizeRow='<tr><td class="hl-engine">Size</td>'+engines.map(function(e){
      return '<td class="hl-cell'+(e===lucene?' hl-base':'')+'">'+fmtBytes(sizes[e])+'</td>';
    }).join('')+'</tr>';
    var ratioRow='';
    if(base){
      ratioRow='<tr><td class="hl-engine">vs Lucene</td>'+engines.map(function(e){
        var r=sizes[e]/base, isBase=e===lucene;
        return '<td class="hl-cell '+sizeClass(r,isBase)+'">'+r.toFixed(2)+'</td>';
      }).join('')+'</tr>';
    }
    var hint=base?' <span class="hl-hint">(and relative to Lucene = 1.00; &gt;1 = larger)</span>':'';
    el.innerHTML='<div class="hl-title">Index size on disk'+hint+'</div><table><thead>'+head+'</thead><tbody>'+sizeRow+ratioRow+'</tbody></table>';
  }
  function load(){ fetch('results.json').then(function(r){return r.json();}).then(render).catch(function(){}); }
  if(document.readyState!=='loading') load(); else document.addEventListener('DOMContentLoaded',load);
})();
