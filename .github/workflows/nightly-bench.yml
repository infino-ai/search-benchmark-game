name: Nightly benchmark

# Runs the full turbopuffer-comparison bench on a c7i.2xlarge, commits
# results.json to master, and lets the existing pages.yml publish the dashboard.
#
# workflow_dispatch accepts an optional `infino_branch` input. When set to
# anything other than "main", only infino-0.1 is benched (tantivy/lucene
# skipped, ~30 min saved) and results are NOT committed to master — instead
# a comparison vs the committed main baseline is posted to the job summary.

on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily
  workflow_dispatch:
    inputs:
      infino_branch:
        description: 'infino branch to bench (default: main)'
        default: 'main'
        required: false
      infino_repo:
        description: 'infino repo to bench, e.g. a public fork (default: infino-ai/infino)'
        default: 'infino-ai/infino'
        required: false

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CORPUS_BUCKET: sbg-bench-corpus
      INFINO_BRANCH: ${{ inputs.infino_branch || 'main' }}
      INFINO_REPO: ${{ inputs.infino_repo || 'infino-ai/infino' }}

    steps:
      - uses: actions/checkout@v4

      # Short-lived token covering both repos (clone infino + push results)
      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game,infino"

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381491836522:role/sbg-ci
          aws-region: us-east-1
          # The wait step polls SSM for the whole bench; the default 1 h
          # OIDC session expires mid-run once a bench exceeds an hour, and
          # get-parameter then fails silently -> the run hangs to the 3 h
          # timeout despite a successful bench. Hold credentials past the
          # 3 h wait timeout. (sbg-ci's max session duration must allow this.)
          role-duration-seconds: 14400

      # Clean up any leftover done-signal from a previous failed run
      - name: Clear stale done-signal
        run: |
          aws ssm delete-parameter --name /sbg-bench/done --region us-east-1 2>/dev/null || true

      - name: Resolve latest AL2023 AMI and default security group
        id: infra
        run: |
          AMI=$(aws ec2 describe-images \
            --owners amazon \
            --filters "Name=name,Values=al2023-ami-*-x86_64" \
                      "Name=state,Values=available" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"

          VPC=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query 'Vpcs[0].VpcId' --output text)
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC" \
                      "Name=group-name,Values=default" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "sg=$SG" >> "$GITHUB_OUTPUT"

      # Substitute the GitHub token, infino repo, and infino branch into the user-data template.
      - name: Build user-data
        id: userdata
        run: |
          sed \
            -e "s|__GH_TOKEN__|${{ steps.app-token.outputs.token }}|g" \
            -e "s|__INFINO_BRANCH__|${INFINO_BRANCH}|g" \
            -e "s|__INFINO_REPO__|${INFINO_REPO}|g" \
            -e "s|__SBG_BRANCH__|${{ github.ref_name }}|g" \
            scripts/user-data-template.sh > /tmp/user-data.sh
          echo "b64=$(base64 -w0 /tmp/user-data.sh)" >> "$GITHUB_OUTPUT"

      - name: Launch c7i.2xlarge bench instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "${{ steps.infra.outputs.ami }}" \
            --instance-type c7i.2xlarge \
            --iam-instance-profile Name=sbg-bench-instance \
            --security-group-ids "${{ steps.infra.outputs.sg }}" \
            --user-data "${{ steps.userdata.outputs.b64 }}" \
            --block-device-mappings \
              '[{"DeviceName":"/dev/xvda","Ebs":{"VolumeSize":120,"VolumeType":"gp3"}}]' \
            --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Name,Value=sbg-bench-nightly}]' \
            --query 'Instances[0].InstanceId' \
            --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Launched instance: $INSTANCE_ID"

      # Poll every 60 s; bench typically finishes in ~2 h
      - name: Wait for benchmark to complete (3 h timeout)
        timeout-minutes: 180
        run: |
          echo "Polling /sbg-bench/done every 60s …"
          while true; do
            # Distinguish "not set yet" (ParameterNotFound — keep polling)
            # from any other failure (expired creds, throttle, API error).
            # The old `2>/dev/null || echo pending` masked those and spun
            # to the 3 h timeout on expired credentials; fail loudly here.
            if OUT=$(aws ssm get-parameter \
                --name /sbg-bench/done \
                --query 'Parameter.Value' \
                --output text 2>&1); then
              STATUS="$OUT"
            elif printf '%s' "$OUT" | grep -q "ParameterNotFound"; then
              STATUS="pending"
            else
              echo "get-parameter failed (not a missing parameter):"
              echo "$OUT"
              exit 1
            fi
            echo "$(date -u +%H:%M:%S)  status=$STATUS"
            [ "$STATUS" = "ok" ]    && break
            [ "$STATUS" = "error" ] && { echo "Bench reported error on EC2."; exit 1; }
            sleep 60
          done

      - name: Fetch EC2 logs on failure
        if: failure()
        run: |
          echo "=== EC2 Benchmark Log ===" | tee bench-output.log
          aws s3 cp "s3://$CORPUS_BUCKET/bench-log.txt" - 2>/dev/null | tee -a bench-output.log || echo "Failed to fetch log from S3"

      - name: Upload logs as artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-logs
          path: bench-output.log
          retention-days: 7

      - name: Download results from S3
        run: |
          if [ "$INFINO_BRANCH" = "main" ] && [ "$INFINO_REPO" = "infino-ai/infino" ]; then
            aws s3 cp "s3://$CORPUS_BUCKET/results.json"      results.json
            aws s3 cp "s3://$CORPUS_BUCKET/results-full.json" results-full.json
          else
            RUN_SLUG="${INFINO_REPO//\//-}-${INFINO_BRANCH//\//-}"
            aws s3 cp "s3://$CORPUS_BUCKET/results-branch-${RUN_SLUG}.json"      "results-branch-${RUN_SLUG}.json"
            aws s3 cp "s3://$CORPUS_BUCKET/results-full-branch-${RUN_SLUG}.json" "results-full-branch-${RUN_SLUG}.json"
          fi

      # Branch runs: compare infino-0.1 column vs committed main baseline and
      # post a markdown table to the job summary. No commit to master.
      - name: Compare branch results vs main
        if: env.INFINO_BRANCH != 'main' || env.INFINO_REPO != 'infino-ai/infino'
        run: |
          RUN_SLUG="${INFINO_REPO//\//-}-${INFINO_BRANCH//\//-}"
          RUN_LABEL="${INFINO_REPO}@${INFINO_BRANCH}"
          python3 scripts/compare_results.py \
            results.json \
            "results-branch-${RUN_SLUG}.json" \
            --label "$RUN_LABEL" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/compare_results.py \
            results-full.json \
            "results-full-branch-${RUN_SLUG}.json" \
            --label "$RUN_LABEL (full 962-query)" \
            >> "$GITHUB_STEP_SUMMARY"

      # The initial app-token may have expired (bench takes ~2 h, token lasts 1 h).
      # Generate a fresh one just for the push.
      - name: Generate fresh token for push
        if: env.INFINO_BRANCH == 'main' && env.INFINO_REPO == 'infino-ai/infino'
        uses: actions/create-github-app-token@v1
        id: push-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game"

      - name: Commit and push results
        if: env.INFINO_BRANCH == 'main' && env.INFINO_REPO == 'infino-ai/infino'
        run: |
          git config user.name  "sbg-ci"
          git config user.email "sbg-ci@infino.ai"
          git add results.json results-full.json
          git diff --cached --quiet && echo "results unchanged — nothing to push" && exit 0
          git commit -m "bench: $(date -u +%F) nightly results"
          # Remove the credential helper installed by actions/checkout so our
          # App token in the push URL is used instead of the default GITHUB_TOKEN.
          git config --unset-all http.https://github.com/.extraheader || true
          PUSH_URL="https://x-access-token:${{ steps.push-token.outputs.token }}@github.com/infino-ai/search-benchmark-game.git"
          # The bench runs for ~1 h, during which master can advance (e.g. a
          # merged PR). A plain push would be rejected as non-fast-forward, so
          # rebase the results commit onto the latest remote master before
          # pushing. The results commit only touches results*.json, so it
          # rebases cleanly over code changes. Retry to absorb a lost race.
          for attempt in 1 2 3 4 5; do
            git fetch "$PUSH_URL" master
            if ! git rebase FETCH_HEAD; then
              git rebase --abort
              echo "rebase onto remote master failed" >&2
              exit 1
            fi
            if git push "$PUSH_URL" HEAD:master; then
              echo "pushed results on attempt $attempt"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — remote advanced, retrying…"
            sleep 5
          done
          echo "failed to push results after 5 attempts" >&2
          exit 1

      # Always clean up — even if the bench or push step failed
      - name: Delete SSM done-signal
        if: always()
        run: |
          aws ssm delete-parameter --name /sbg-bench/done --region us-east-1 2>/dev/null || true

      - name: Terminate EC2 instance
        if: always()
        run: |
          aws ec2 terminate-instances --instance-ids "${{ steps.ec2.outputs.id }}"
          echo "Terminated ${{ steps.ec2.outputs.id }}"
