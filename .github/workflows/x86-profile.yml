# AVX2 (c7i) query profiler. Builds do_query for both codecs — the branch
# (256-doc blocks) and main (128-doc blocks) — indexes the real corpus with
# each, and profiles do_query over the real query set in four modes (TOP_10 /
# TOP_100 / TOP_1000 / COUNT) with Linux perf: hardware counters (IPC, L1 +
# branch misses) via `perf stat` and a flat function profile via `perf record`,
# plus a branch-vs-main comparison summary — real AVX2, the thing a Mac / NEON
# sampler cannot measure.
#
# Fully isolated from nightly-bench: it signals completion via a distinct S3
# key (profile-done.txt) and writes its own S3 result keys, so it can run
# alongside a nightly/same-box bench (which uses SSM /sbg-bench/done) without
# colliding. S3, not SSM, because the sbg-ci role is scoped to /sbg-bench/* in
# SSM but already has access to this bucket.
name: x86 query profile

on:
  workflow_dispatch:
    inputs:
      infino_branch:
        description: 'infino branch to profile (256-block codec), e.g. fts-256-blocks'
        default: 'main'
      infino_repo:
        description: 'infino repo, e.g. a public fork'
        default: 'infino-ai/infino'

permissions:
  id-token: write
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      CORPUS_BUCKET: sbg-bench-corpus
      INFINO_BRANCH: ${{ inputs.infino_branch || 'main' }}
      INFINO_REPO: ${{ inputs.infino_repo || 'infino-ai/infino' }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: infino-ai
          repositories: "search-benchmark-game,infino"

      - name: Configure AWS credentials (OIDC — no stored keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::381491836522:role/sbg-ci
          aws-region: us-east-1
          role-duration-seconds: 14400

      # The done-signal key is unique per run (the roles lack s3:DeleteObject,
      # so a fixed key can't be cleared and a prior run's value would be
      # misread). No clear step needed.
      - name: Resolve latest AL2023 AMI and default security group
        id: infra
        run: |
          AMI=$(aws ec2 describe-images --owners amazon \
            --filters "Name=name,Values=al2023-ami-*-x86_64" "Name=state,Values=available" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' --output text)
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"
          VPC=$(aws ec2 describe-vpcs --filters "Name=isDefault,Values=true" \
            --query 'Vpcs[0].VpcId' --output text)
          SG=$(aws ec2 describe-security-groups \
            --filters "Name=vpc-id,Values=$VPC" "Name=group-name,Values=default" \
            --query 'SecurityGroups[0].GroupId' --output text)
          echo "sg=$SG" >> "$GITHUB_OUTPUT"

      - name: Build user-data
        id: userdata
        run: |
          sed \
            -e "s|__GH_TOKEN__|${{ steps.app-token.outputs.token }}|g" \
            -e "s|__INFINO_BRANCH__|${INFINO_BRANCH}|g" \
            -e "s|__INFINO_REPO__|${INFINO_REPO}|g" \
            -e "s|__SBG_BRANCH__|${{ github.ref_name }}|g" \
            -e "s|__DONE_OBJ__|profile-done-${{ github.run_id }}.txt|g" \
            scripts/profile-user-data.sh > /tmp/user-data.sh
          echo "b64=$(base64 -w0 /tmp/user-data.sh)" >> "$GITHUB_OUTPUT"

      - name: Launch c7i.2xlarge profile instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id "${{ steps.infra.outputs.ami }}" \
            --instance-type c7i.2xlarge \
            --iam-instance-profile Name=sbg-bench-instance \
            --security-group-ids "${{ steps.infra.outputs.sg }}" \
            --user-data "${{ steps.userdata.outputs.b64 }}" \
            --block-device-mappings \
              '[{"DeviceName":"/dev/xvda","Ebs":{"VolumeSize":120,"VolumeType":"gp3"}}]' \
            --tag-specifications \
              'ResourceType=instance,Tags=[{Key=Name,Value=sbg-x86-profile}]' \
            --query 'Instances[0].InstanceId' --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Launched instance: $INSTANCE_ID"

      - name: Wait for profile to complete (4 h timeout)
        timeout-minutes: 240
        run: |
          DONE="s3://${CORPUS_BUCKET}/profile-done-${{ github.run_id }}.txt"
          echo "Polling $DONE every 60s …"
          while true; do
            if OUT=$(aws s3 cp "$DONE" - 2>&1); then
              STATUS="$OUT"
            elif printf '%s' "$OUT" | grep -qiE "NoSuchKey|Not Found|does not exist"; then
              STATUS="pending"
            else
              echo "s3 read failed (not a missing key):"; echo "$OUT"; exit 1
            fi
            echo "$(date -u +%H:%M:%S)  status=$STATUS"
            [ "$STATUS" = "ok" ]    && break
            [ "$STATUS" = "error" ] && { echo "Profile reported error on EC2."; exit 1; }
            sleep 60
          done

      # Print the whole profiling section (all perf-stat blocks, per-mode top
      # functions, and the branch-vs-main comparison summary) to the job log,
      # so results are readable straight from `gh run view --log` — no separate
      # fetch workflow. Also mirrored into the run summary.
      - name: Print profile results
        if: always()
        run: |
          aws s3 cp "s3://$CORPUS_BUCKET/profile-log.txt" /tmp/plog.txt 2>/dev/null || echo "(no log)"
          OUT=$(awk '/### PROFILE|COMPARISON SUMMARY/{p=1} p' /tmp/plog.txt)
          echo "$OUT"
          { echo '```'; echo "$OUT"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fetch EC2 log on failure
        if: failure()
        run: aws s3 cp "s3://$CORPUS_BUCKET/profile-log.txt" - 2>/dev/null || echo "no log"

      - name: Terminate EC2 instance
        if: always() && steps.ec2.outputs.id != ''
        run: aws ec2 terminate-instances --instance-ids "${{ steps.ec2.outputs.id }}"
