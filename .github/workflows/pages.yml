name: Deploy benchmark site

# Publishes the dashboard to https://infino-ai.github.io/search-benchmark-game
# whenever an updated results.json (or the prebuilt web app) lands on master.
# The web app is prebuilt and committed under web/build (react-scripts 3.4.3),
# so we just drop results.json next to index.html and deploy — no Node build.

on:
  push:
    branches: [master]
    paths:
      - results.json
      - results-full.json
      - web/build/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage results into the prebuilt site
        run: |
          # tpuf comparison → root dashboard
          [ -f results.json ]      && cp results.json      web/build/results.json      || echo "no results.json; using committed fallback"
          # full 962-query benchmark → /full dashboard
          [ -f results-full.json ] && cp results-full.json web/build/full/results.json || echo "no results-full.json; /full will be empty until first nightly run"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build
      - id: deploy
        uses: actions/deploy-pages@v4
